[project]
name = "storybuilderbook"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [
    { name = "Khan Kibria", email = "khan.kibria@gmail.com" }
]

requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "python-frontmatter>=1.1.0",
    "regex>=2024.11.6",
    "toolslib",
]

[project.scripts]
fixfm = "storybuilderbook:main"
fixsum = "storybuilderbook.scan:main"
hydrate = "storybuilderbook.hydrate:main"
deploy = "storybuilderbook.deploy:main"
bookbuild = "storybuilderbook.editions:main"
bookserve = "storybuilderbook.editions:serve"

[build-system]
requires = ["uv_build>=0.9.15,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
toolslib = { git = "https://github.com/kkibria/toolslib.git" }