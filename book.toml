[book]
authors = ["Khan Kibria"]
language = "en"
src = "booksrc"
title = "Story Studio — A Writer’s Companion"

[build]
build-dir = "gh-pages/docs"

# mdbook-frntmtr can be installed from github with,
# cargo install --git https://github.com/kkibria/mdbook-frntmtr.git
[preprocessor.frntmtr]
command = "mdbook-frntmtr"
template = "fm.template"


#[preprocessor.svgdx]
# local copy 
# command = "cargo run --manifest-path D:/mdbook-svgdx/Cargo.toml --quiet"
[output.html]
additional-css = ["theme/bangla.css"]
site-url = "/storybuilderbook/"
